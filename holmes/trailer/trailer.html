<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Irregulars trailer</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* The Irregulars: a 45-second trailer comparing three ways to solve a murder: one genius detective, Holmes with
   the Baker Street Irregulars (a lead with many helpers on dedicated errands), and a leaderless swarm.
   render(t) draws the frame at t seconds and depends on nothing else, so render.py can screenshot frames one by
   one (open with #play to watch it live). Data: trailer_data.json, inlined by render.py as window.DATA. Map
   footage comes from real runs of case 3; every number is from the 20-case benchmarks. System fonts only. */
const D = window.DATA;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1920, H = 1080, DUR = 45;
const SERIF = "Baskerville, 'Libre Baskerville', Georgia, serif";
const INK = "#2a1d12", CREAM = "#efe6cf", DIM = "#9c937e", RED = "#a3171d", GOLD = "#e0b357", PAPER = "#efe2c2";
const BLUE = "#2f5f8f", SWARM = "#a3392e";

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const fade = (t, a, b, f = 0.4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function text(s, x, y, {size = 60, color = CREAM, align = "center", style = "", alpha = 1, font = SERIF, spacing = 0} = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle";
  g.font = `${style} ${size}px ${font}`; if (spacing) g.letterSpacing = `${spacing}px`; g.fillText(s, x, y); g.restore();
}
const typed = (s, t, a, cps = 30) => s.slice(0, Math.max(0, Math.floor((t - a) * cps)));

/* ---------------------------------------------------------------- atmosphere */
function fog(t, alpha = 1, lamp = true) {
  g.fillStyle = "#06080b"; g.fillRect(0, 0, W, H);
  const r = rng(7);
  for (let i = 0; i < 16; i++) {
    const x = (r() * W + t * (18 + r() * 36)) % (W + 700) - 350, y = r() * H, rad = 280 + r() * 360;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(150,160,170,${0.09 * alpha})`); gr.addColorStop(1, "rgba(150,160,170,0)");
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  if (lamp) { const fl = 0.2 + 0.03 * Math.sin(t * 13) * Math.sin(t * 7);
    const gl = g.createRadialGradient(1660, 230, 0, 1660, 230, 460);
    gl.addColorStop(0, `rgba(255,185,90,${fl * alpha})`); gl.addColorStop(1, "rgba(255,185,90,0)");
    g.fillStyle = gl; g.fillRect(1100, 0, 820, 760); }
}
function vignette(a = 0.75) {
  const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function paper(x, y, w, h, seed = 2) {
  g.save(); g.fillStyle = PAPER; g.shadowColor = "rgba(0,0,0,0.55)"; g.shadowBlur = 40; g.fillRect(x, y, w, h); g.restore();
  const r = rng(seed); g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  for (let i = 0; i < 40; i++) { const px = x + r() * w, py = y + r() * h, rr = 40 + r() * 160;
    const gr = g.createRadialGradient(px, py, 0, px, py, rr); gr.addColorStop(0, "rgba(150,110,60,0.07)"); gr.addColorStop(1, "rgba(150,110,60,0)");
    g.fillStyle = gr; g.fillRect(px - rr, py - rr, rr * 2, rr * 2); }
  const e = g.createLinearGradient(x, y, x, y + h); e.addColorStop(0, "rgba(120,80,30,0.15)"); e.addColorStop(0.5, "rgba(0,0,0,0)"); e.addColorStop(1, "rgba(120,80,30,0.2)");
  g.fillStyle = e; g.fillRect(x, y, w, h); g.restore();
}

/* ---------------------------------------------------------------- magnifying glass: reveals `draw` inside the lens */
function lens(cx, cy, R, draw) {
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip(); draw();
  const sh = g.createRadialGradient(cx - R * 0.3, cy - R * 0.3, 0, cx, cy, R); sh.addColorStop(0, "rgba(255,255,255,0.12)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sh; g.fillRect(cx - R, cy - R, R * 2, R * 2); g.restore();
  g.save(); g.lineWidth = 16; g.strokeStyle = "#7a5a2a"; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
  g.lineWidth = 4; g.strokeStyle = GOLD; g.beginPath(); g.arc(cx, cy, R - 7, 0, 7); g.stroke();
  g.translate(cx, cy); g.rotate(0.75); g.fillStyle = "#3b2414"; g.fillRect(R + 4, -15, 190, 30); g.fillStyle = GOLD; g.fillRect(R - 4, -19, 22, 38);
  g.restore();
}

/* ---------------------------------------------------------------- silhouette: deerstalker and pipe */
function holmes(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.ellipse(0, -40, 62, 74, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-80, -70); g.quadraticCurveTo(0, -190, 80, -70); g.lineTo(96, -60); g.lineTo(-96, -60); g.fill();
  g.beginPath(); g.moveTo(-150, 200); g.quadraticCurveTo(-140, 40, 0, 30); g.quadraticCurveTo(140, 40, 150, 200); g.fill();
  g.lineWidth = 12; g.strokeStyle = col; g.beginPath(); g.moveTo(40, 0); g.quadraticCurveTo(80, 20, 96, 6); g.stroke(); g.fillRect(88, -18, 22, 28);
  g.restore();
}

/* ---------------------------------------------------------------- the map (real runs, case 3) */
const M = D.map, IDX = Object.fromEntries(M.ids.map((id, i) => [id, i]));
const MX = (W - 1440) / 2, MY = 30, MS = 1.44;            // map 1000x700 -> 1440x1008
const P = ([x, y]) => [MX + x * MS, MY + y * MS];
const A = (id) => P(M.addresses[IDX[id]]);
function baseMap() {
  g.fillStyle = "#0b0d10"; g.fillRect(0, 0, W, H);
  paper(MX, MY, 1440, 1008, 9);
  g.strokeStyle = "rgba(70,110,150,0.55)"; g.lineWidth = 22; g.lineCap = "round"; g.beginPath();
  M.thames.forEach((p, i) => { const [x, y] = P(p); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
  g.strokeStyle = "rgba(90,65,35,0.35)"; g.lineWidth = 1.6; g.beginPath();
  for (const [a, b] of M.edges) { const [ax, ay] = A(a), [bx, by] = A(b); g.moveTo(ax, ay); g.lineTo(bx, by); }
  g.stroke();
  g.fillStyle = "rgba(70,50,30,0.6)"; for (const a of M.addresses) { const [x, y] = P(a); g.fillRect(x - 3, y - 3, 6, 6); }
  for (const d of M.districts) { const [x, y] = P([d.x, d.y]); text(d.name.toUpperCase(), x, y - 52, {size: 19, color: "rgba(80,60,35,0.6)", spacing: 3}); }
  const [bx, by] = A(M.baker); star(bx, by, 18, INK); text("221B", bx, by - 30, {size: 24, color: INK, style: "bold"});
  text("map: a real run of case 3", MX + 1420, MY + 990, {size: 18, color: "rgba(42,29,18,0.55)", align: "right", style: "italic"});
  const [cx, cy] = A(M.scene); g.strokeStyle = RED; g.lineWidth = 6;
  g.beginPath(); g.moveTo(cx - 12, cy - 12); g.lineTo(cx + 12, cy + 12); g.moveTo(cx + 12, cy - 12); g.lineTo(cx - 12, cy + 12); g.stroke();
}
function star(x, y, r, col) { g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill(); }
function walkers(run, f, col, r, trail = 0) {
  const T = run.length - 1, ft = f * T, i0 = Math.floor(ft), i1 = Math.min(T, i0 + 1), k = ft - i0;
  const at = (i, j) => run[clamp(i, 0, T)].boys[j];
  const n = run[i0].boys.length;
  for (let j = 0; j < n; j++) {
    const p = at(i0, j), q = at(i1, j) || p, pos = P([p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]);
    if (trail) { g.strokeStyle = col; g.globalAlpha = 0.35; g.lineWidth = 3; g.beginPath(); g.moveTo(...pos);
      for (let b = 0; b < trail; b++) g.lineTo(...P(at(i0 - b, j))); g.stroke(); g.globalAlpha = 1; }
    g.fillStyle = col; g.beginPath(); g.arc(pos[0], pos[1], r, 0, 7); g.fill();
  }
  return {a: run[i0], b: run[i1], k};
}
function caption(lines, t, a, b) {
  const al = fade(t, a, b, 0.35);
  if (al <= 0) return;
  g.save(); g.globalAlpha = al * 0.82; const gr = g.createLinearGradient(0, H - 230, 0, H);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(0.35, "rgba(0,0,0,0.85)"); gr.addColorStop(1, "rgba(0,0,0,0.92)");
  g.fillStyle = gr; g.fillRect(0, H - 230, W, 230); g.restore();
  lines.forEach((l, i) => text(l, W / 2, H - 120 + i * 58 - (lines.length - 1) * 29, {size: 46, style: "italic", alpha: al}));
}
function chapter(num, title, sub, t, a) {
  const al = fade(t, a, a + 2.6, 0.4);
  if (al <= 0) return;
  g.save(); g.globalAlpha = al * 0.85; g.fillStyle = "rgba(6,8,11,0.9)"; g.fillRect(70, 70, 780, 200); g.restore();
  text(num, 110, 128, {size: 34, color: GOLD, align: "left", alpha: al, spacing: 6});
  text(title, 110, 186, {size: 58, align: "left", alpha: al});
  text(sub, 110, 240, {size: 28, color: DIM, align: "left", style: "italic", alpha: al});
}
function clock(minutes, alpha) {
  const hh = Math.floor(8 + minutes / 60), mm = Math.floor(minutes % 60);
  text(`${String(hh % 24).padStart(2, "0")}:${String(mm).padStart(2, "0")}`, W - 130, 110, {size: 52, color: CREAM, alpha, style: "bold"});
  text("case time", W - 130, 154, {size: 22, color: DIM, alpha, style: "italic"});
}
function note(s, alpha = 1) { text(s, W - 60, 205, {size: 26, color: CREAM, align: "right", style: "italic", alpha}); }

/* ================================================================ scenes */
const SCENES = [[0, 5.6, telegram], [5.6, 8.6, threeWays], [8.6, 15.6, lone], [15.6, 23.0, baker], [23.0, 30.0, swarm],
  [30.0, 37.6, twist], [37.6, 43.0, casebook], [43.0, 45.01, endCard]];

function window221(t, al) {
  // Baker Street at night: a lit first-floor window with Holmes in profile, pipe smoke rising, the door below
  g.save(); g.globalAlpha = al;
  g.fillStyle = "#14110d"; g.fillRect(560, 120, 800, 900);                       // the house front
  for (let y = 140; y < 1020; y += 26) { g.fillStyle = "rgba(255,255,255,0.025)"; g.fillRect(560, y, 800, 2); }
  const wx = 760, wy = 240, ww = 400, wh = 360;
  const glow = g.createRadialGradient(wx + ww / 2, wy + wh / 2, 40, wx + ww / 2, wy + wh / 2, 520);
  glow.addColorStop(0, "rgba(255,190,100,0.35)"); glow.addColorStop(1, "rgba(255,190,100,0)");
  g.fillStyle = glow; g.fillRect(wx - 400, wy - 400, ww + 800, wh + 800);
  g.fillStyle = "#e9a95a"; g.fillRect(wx, wy, ww, wh);
  g.save(); g.beginPath(); g.rect(wx, wy, ww, wh); g.clip();
  holmes(wx + 170, wy + 250, 0.8, "#1a120b");
  const r = rng(3);                                                              // smoke curls from the pipe
  for (let i = 0; i < 9; i++) { const k = ((t * 0.35 + i / 9) % 1), sx = wx + 255 + Math.sin(k * 9 + i) * 22, sy = wy + 235 - k * 220;
    g.fillStyle = `rgba(80,60,40,${0.35 * (1 - k)})`; g.beginPath(); g.arc(sx, sy, 8 + k * 26 + r() * 4, 0, 7); g.fill(); }
  g.restore();
  g.strokeStyle = "#0d0a07"; g.lineWidth = 14; g.strokeRect(wx, wy, ww, wh);
  g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.moveTo(wx, wy + wh / 2); g.lineTo(wx + ww, wy + wh / 2); g.lineWidth = 8; g.stroke();
  g.fillStyle = "#1d2a1f"; g.fillRect(860, 720, 200, 300);                      // the door
  g.fillStyle = GOLD; g.beginPath(); g.arc(1030, 880, 8, 0, 7); g.fill();
  g.fillStyle = "#2a2116"; g.fillRect(890, 680, 140, 36); text("221B", 960, 699, {size: 30, color: GOLD, style: "bold", spacing: 4});
  g.restore();
}
function telegram(t) {
  fog(t);
  window221(t, fade(t, 0.0, 3.0, 0.6) * 1);
  text("Baker Street, London. A November night.", W / 2, 1040, {size: 34, color: DIM, style: "italic", alpha: fade(t, 0.4, 2.6, 0.4)});
  const al = fade(t, 2.2, 5.6, 0.4), mono = "'Courier New', monospace", y = (1 - ease(prog(t, 2.2, 2.7))) * 300;
  if (al > 0) {
    g.save(); g.globalAlpha = al; g.translate(W / 2, H / 2 + y); g.rotate(-0.025);
    paper(-520, -170, 1040, 300, 4);
    text("POST OFFICE TELEGRAPH · TO MR SHERLOCK HOLMES, 221B", 0, -125, {size: 24, color: INK, spacing: 4});
    g.fillStyle = "rgba(42,29,18,0.5)"; g.fillRect(-450, -100, 900, 2);
    text(typed("COME AT ONCE. MURDER IN WHITECHAPEL.", t, 2.6, 30), -440, -40, {size: 42, color: INK, align: "left", font: mono, style: "bold"});
    text(typed("TEN SUSPECTS. NO ARREST. LESTRADE", t, 3.9, 30), -440, 30, {size: 42, color: INK, align: "left", font: mono, style: "bold"});
    g.restore();
  }
  text("“The game is afoot.”", W / 2, 930, {size: 56, style: "italic", alpha: fade(t, 4.6, 5.6, 0.3)});
  vignette();
}
function threeWays(t) {
  fog(t, 0.8, false);
  const s = "Three ways to solve a murder.";
  const cx = 360 + 1200 * ease(prog(t, 5.8, 7.8)), cy = 520 + Math.sin(t * 2) * 20;
  text(s, W / 2, 520, {size: 96, color: "rgba(239,230,207,0.10)"});
  lens(cx, cy, 190, () => { g.fillStyle = "rgba(20,16,12,0.6)"; g.fillRect(0, 0, W, H); text(s, W / 2, 520, {size: 96}); });
  text(s, W / 2, 520, {size: 96, alpha: prog(t, 7.7, 8.2)});
  vignette();
}
function lone(t) {
  baseMap();
  const path = D.solo.path, f = ease(prog(t, 9.0, 15.0)), n = path.length - 1, ft = f * n, i0 = Math.floor(ft), k = ft - i0;
  g.strokeStyle = RED; g.lineWidth = 5; g.setLineDash([14, 10]); g.beginPath();
  path.slice(0, i0 + 1).forEach((id, i) => { const [x, y] = A(id); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  const p = A(path[i0]), q = A(path[Math.min(n, i0 + 1)]), cab = [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
  g.lineTo(...cab); g.stroke(); g.setLineDash([]);
  path.slice(1, i0 + 1).forEach((id) => { const [x, y] = A(id); g.strokeStyle = RED; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 11, 0, 7); g.stroke(); });
  g.fillStyle = RED; g.beginPath(); g.arc(cab[0], cab[1], 14, 0, 7); g.fill();
  vignette(0.55);
  clock(f * 720, 1);
  note(`doors knocked on: ${i0} of 100`);
  chapter("I.", "The Lone Genius", "one brilliant model plays the detective", t, 8.6);
  caption(["One brilliant mind. One cab. One door at a time."], t, 11.0, 13.4);
  caption(["Sharp enough to see through any lie…", "but a hundred doors, and only twelve hours."], t, 13.3, 15.6);
}
function baker(t) {
  baseMap();
  const f = ease(prog(t, 15.8, 22.8));
  const [bx, by] = A(M.baker), pulse = 0.5 + 0.5 * Math.sin(t * 5);
  const gl = g.createRadialGradient(bx, by, 0, bx, by, 120); gl.addColorStop(0, `rgba(224,179,87,${0.35 + 0.2 * pulse})`); gl.addColorStop(1, "rgba(224,179,87,0)");
  g.fillStyle = gl; g.fillRect(bx - 120, by - 120, 240, 240);
  const w = walkers(D.baker, f, BLUE, 9, 3);
  if (w.a.w) { const q = w.b.w || w.a.w, pos = P([w.a.w[0] + (q[0] - w.a.w[0]) * w.k, w.a.w[1] + (q[1] - w.a.w[1]) * w.k]);
    g.fillStyle = GOLD; g.beginPath(); g.arc(pos[0], pos[1], 13, 0, 7); g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    text("Wiggins", pos[0] + 20, pos[1] - 22, {size: 22, color: INK, align: "left", style: "italic"}); }
  holmes(bx + 70, by + 120, 0.32, INK);
  vignette(0.55);
  clock(f * (D.baker.length - 1) * 15, 1);
  note(`reports reaching 221B: ${w.a.reports}`);
  chapter("II.", "Holmes & the Irregulars", "a lead mind, helpers on dedicated errands", t, 15.6);
  caption(["Holmes never leaves 221B. He thinks, and gives the orders."], t, 18.0, 20.5);
  caption(["Wiggins and twelve street boys each take a street,", "and run back with what they find."], t, 20.4, 23.0);
}
function swarm(t) {
  baseMap();
  const f = ease(prog(t, 23.2, 29.6)), w = walkers(D.swarm, f, SWARM, 6);
  g.strokeStyle = "rgba(163,57,46,0.25)"; g.lineWidth = 2;
  for (const s of (w.a.shares || []).slice(0, 30)) { const [x, y] = P(s); g.beginPath(); g.arc(x, y, 200 * MS * (0.25 + 0.75 * w.k), 0, 7); g.stroke(); }
  const v = Math.round(w.a.truth_votes + ((w.b.truth_votes || 0) - w.a.truth_votes) * w.k);
  vignette(0.55);
  clock(f * (D.swarm.length - 1) * 15, 1);
  note(`boys agreeing on one answer: ${v} (30 close the case)`);
  chapter("III.", "The Swarm", "a hundred boys, and no one in charge", t, 23.0);
  caption(["No one in charge. Every boy shouts what he has heard…"], t, 25.4, 27.8);
  caption(["…and the case closes when thirty agree."], t, 27.7, 30.0);
}
function twist(t) {
  fog(t, 0.7);
  text("Then the murderer planned it.", W / 2, 150, {size: 70, alpha: fade(t, 30.0, 37.6, 0.4)});
  const notes = [["The coachman", "“The man took snuff, sir.”"], ["The valet", "“Grey-haired. I'd swear to it.”"],
    ["The housekeeper", "“My master never went out.”"]];
  notes.forEach(([who, say], i) => {
    const a = 30.5 + i * 0.35, al = prog(t, a, a + 0.3); if (al <= 0) return;
    g.save(); g.globalAlpha = al; g.translate(330 + i * 630, 470); g.rotate((i - 1) * 0.04);
    paper(-270, -150, 540, 300, 20 + i);
    text(who, 0, -80, {size: 34, color: RED, style: "italic"});
    text(say, 0, 10, {size: 34, color: INK, style: "italic"});
    text("all three serve Henry Pargeter", 0, 90, {size: 22, color: "rgba(42,29,18,0.6)", style: "italic"});
    g.restore();
  });
  // the lens slides across: under the glass, each statement shows what lies behind it
  if (t > 32.0 && t < 35.4) {
    const cx = 330 + 1260 * ease(prog(t, 32.0, 35.0)), cy = 480;
    lens(cx, cy, 175, () => { g.fillStyle = "#1a120b"; g.fillRect(0, 0, W, H);
      for (let i = 0; i < 3; i++) { text("paid one sovereign", 330 + i * 630, 450, {size: 38, color: GOLD, style: "italic"});
        text("“tell it the same way”", 330 + i * 630, 505, {size: 34, color: CREAM, style: "italic"}); } });
  }
  const res = [["The Lone Genius", "sees through it", true], ["Holmes & the Irregulars", "sees through it", true], ["The Swarm", "split, often fooled", false]];
  res.forEach(([who, what, ok], i) => {
    const a = 35.4 + i * 0.4, al = fade(t, a, 37.6, 0.25); if (al <= 0) return;
    text(`${who}: ${what}`, 330 + i * 630, 760, {size: 36, color: ok ? CREAM : "#e4836f", alpha: al});
    text(ok ? "✓" : "✗", 330 + i * 630, 830, {size: 64, color: ok ? GOLD : "#e4836f", alpha: al});
  });
  text("“Pargeter's servants supply both his alibi and evidence against Leopold.”  gpt-6-astra as Holmes",
    W / 2, 960, {size: 30, color: DIM, style: "italic", alpha: fade(t, 35.8, 37.6, 0.3)});
  vignette(0.6);
}
function casebook(t) {
  fog(t, 0.5, false);
  const al = prog(t, 37.6, 38.0);
  g.save(); g.globalAlpha = al; paper(260, 90, 1400, 780, 31); g.restore();
  text("From the casebook", W / 2, 160, {size: 54, color: INK, style: "italic", alpha: al});
  text("murders solved out of 20 · the same cases · twelve hours each", W / 2, 216, {size: 26, color: "rgba(42,29,18,0.7)", alpha: al});
  const cols = [1180, 1460];
  text("ordinary", cols[0], 300, {size: 32, color: INK, style: "italic", alpha: al});
  text("planned", cols[1], 300, {size: 32, color: RED, style: "italic", alpha: al});
  const rows = [["The Lone Genius", "gpt-6-astra alone", 11, 11], ["Holmes & the Irregulars", "gpt-6-astra leads, Jev boys run errands", 19, 17],
    ["The Swarm", "a hundred Jev boys, no leader", 11, 9]];
  rows.forEach(([who, how, a, b], i) => {
    const r = prog(t, 38.1 + i * 0.45, 38.5 + i * 0.45), y = 410 + i * 150;
    text(who, 340, y - 14, {size: 46, color: INK, align: "left", alpha: r});
    text(how, 340, y + 32, {size: 26, color: "rgba(42,29,18,0.65)", align: "left", style: "italic", alpha: r});
    text(String(a), cols[0], y, {size: 70, color: INK, alpha: r});
    text(String(b), cols[1], y, {size: 70, color: RED, alpha: r});
  });
  const c = ease(prog(t, 40.0, 40.8));   // a red-ink ring around the winner
  if (c > 0) { g.save(); g.strokeStyle = RED; g.lineWidth = 6; g.beginPath(); g.ellipse(960, 560, 690, 74, -0.01, -Math.PI / 2, -Math.PI / 2 + c * Math.PI * 2.05); g.stroke(); g.restore(); }
  text("A swarm run by a simple counting rule: 18 on ordinary cases, 0 on planned ones.", W / 2, 820, {size: 26, color: "rgba(42,29,18,0.7)", style: "italic", alpha: prog(t, 39.6, 40.0)});
  text("The genius thinks. The Irregulars look. Together, they solve it.", W / 2, 965, {size: 50, style: "italic", alpha: prog(t, 41.0, 41.5)});
  vignette(0.5);
}
function endCard(t) {
  fog(t, 0.6);
  const p = prog(t, 43.1, 43.6);
  holmes(W / 2, 360, 0.75 * (0.96 + 0.04 * p), `rgba(239,230,207,${0.9 * p})`);
  text("THE IRREGULARS", W / 2, 640, {size: 120, alpha: p, spacing: 10});
  text("one genius · a lead with helpers · a swarm", W / 2, 740, {size: 36, color: DIM, style: "italic", alpha: prog(t, 43.5, 43.9)});
  text("“Elementary.”", W / 2, 860, {size: 56, alpha: prog(t, 44.0, 44.3)});
  vignette();
}

function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  const sc = SCENES.find(([a, b]) => t >= a && t < b) || SCENES[SCENES.length - 1];
  sc[2](t);
  for (const [a] of SCENES.slice(1)) { const d = Math.abs(t - a); if (d < 0.18) { g.fillStyle = `rgba(0,0,0,${1 - d / 0.18})`; g.fillRect(0, 0, W, H); } }
}
window.render = render;
const q = new URLSearchParams(location.search);
if (location.hash === "#play") { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
else render(parseFloat(q.get("t") || "0"));
</script>
