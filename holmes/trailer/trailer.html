<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Irregulars trailer</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* The Irregulars: a 45-second trailer comparing three ways to solve a murder: one genius detective, Holmes with
   the Baker Street Irregulars (a lead with many helpers on dedicated errands), and a leaderless swarm.
   render(t) draws the frame at t seconds and depends on nothing else, so render.py can screenshot frames one by
   one (open with #play to watch it live). Data: trailer_data.json, inlined by render.py as window.DATA. Map
   footage is the real benchmark runs of one case; every number is from the 100-case benchmark. System fonts only. */
const D = window.DATA;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1920, H = 1080, DUR = 95;
const SERIF = "Baskerville, 'Libre Baskerville', Georgia, serif";
const SANS = "'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif";   // small text: clearer than an italic serif
const INK = "#2a1d12", CREAM = "#efe6cf", DIM = "#9c937e", RED = "#a3171d", GOLD = "#e0b357", PAPER = "#efe2c2";
const BLUE = "#2f5f8f", SWARM = "#a3392e";

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const fade = (t, a, b, f = 0.4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function text(s, x, y, {size = 60, color = CREAM, align = "center", style = "", alpha = 1, font = SERIF, spacing = 0} = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle";
  if (font === SERIF && size <= 50) { font = SANS; style = style.replace("italic", "").trim() || "500"; }  // readable small text
  g.font = `${style} ${size}px ${font}`; if (spacing) g.letterSpacing = `${spacing}px`; g.fillText(s, x, y); g.restore();
}
const typed = (s, t, a, cps = 30) => s.slice(0, Math.max(0, Math.floor((t - a) * cps)));

/* ---------------------------------------------------------------- atmosphere */
function fog(t, alpha = 1, lamp = true) {
  g.fillStyle = "#06080b"; g.fillRect(0, 0, W, H);
  const r = rng(7);
  for (let i = 0; i < 16; i++) {
    const x = (r() * W + t * (18 + r() * 36)) % (W + 700) - 350, y = r() * H, rad = 280 + r() * 360;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(150,160,170,${0.09 * alpha})`); gr.addColorStop(1, "rgba(150,160,170,0)");
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  if (lamp) { const fl = 0.2 + 0.03 * Math.sin(t * 13) * Math.sin(t * 7);
    const gl = g.createRadialGradient(1660, 230, 0, 1660, 230, 460);
    gl.addColorStop(0, `rgba(255,185,90,${fl * alpha})`); gl.addColorStop(1, "rgba(255,185,90,0)");
    g.fillStyle = gl; g.fillRect(1100, 0, 820, 760); }
}
function vignette(a = 0.75) {
  const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function paper(x, y, w, h, seed = 2) {
  g.save(); g.fillStyle = PAPER; g.shadowColor = "rgba(0,0,0,0.55)"; g.shadowBlur = 40; g.fillRect(x, y, w, h); g.restore();
  const r = rng(seed); g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  for (let i = 0; i < 40; i++) { const px = x + r() * w, py = y + r() * h, rr = 40 + r() * 160;
    const gr = g.createRadialGradient(px, py, 0, px, py, rr); gr.addColorStop(0, "rgba(150,110,60,0.07)"); gr.addColorStop(1, "rgba(150,110,60,0)");
    g.fillStyle = gr; g.fillRect(px - rr, py - rr, rr * 2, rr * 2); }
  const e = g.createLinearGradient(x, y, x, y + h); e.addColorStop(0, "rgba(120,80,30,0.15)"); e.addColorStop(0.5, "rgba(0,0,0,0)"); e.addColorStop(1, "rgba(120,80,30,0.2)");
  g.fillStyle = e; g.fillRect(x, y, w, h); g.restore();
}

/* ---------------------------------------------------------------- magnifying glass: reveals `draw` inside the lens */
function lens(cx, cy, R, draw) {
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip(); draw();
  const sh = g.createRadialGradient(cx - R * 0.3, cy - R * 0.3, 0, cx, cy, R); sh.addColorStop(0, "rgba(255,255,255,0.12)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sh; g.fillRect(cx - R, cy - R, R * 2, R * 2); g.restore();
  g.save(); g.lineWidth = 16; g.strokeStyle = "#7a5a2a"; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
  g.lineWidth = 4; g.strokeStyle = GOLD; g.beginPath(); g.arc(cx, cy, R - 7, 0, 7); g.stroke();
  g.translate(cx, cy); g.rotate(0.75); g.fillStyle = "#3b2414"; g.fillRect(R + 4, -15, 190, 30); g.fillStyle = GOLD; g.fillRect(R - 4, -19, 22, 38);
  g.restore();
}

/* ---------------------------------------------------------------- silhouette: deerstalker and pipe */
function holmes(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.ellipse(0, -40, 62, 74, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-80, -70); g.quadraticCurveTo(0, -190, 80, -70); g.lineTo(96, -60); g.lineTo(-96, -60); g.fill();
  g.beginPath(); g.moveTo(-150, 200); g.quadraticCurveTo(-140, 40, 0, 30); g.quadraticCurveTo(140, 40, 150, 200); g.fill();
  g.lineWidth = 12; g.strokeStyle = col; g.beginPath(); g.moveTo(40, 0); g.quadraticCurveTo(80, 20, 96, 6); g.stroke(); g.fillRect(88, -18, 22, 28);
  g.restore();
}

/* ---------------------------------------------------------------- the map (real runs, case 3) */
const M = D.map, IDX = Object.fromEntries(M.ids.map((id, i) => [id, i]));
const MX = (W - 1440) / 2, MY = 30, MS = 1.44;            // map 1000x700 -> 1440x1008
const P = ([x, y]) => [MX + x * MS, MY + y * MS];
const A = (id) => P(M.addresses[IDX[id]]);
const PARKS = [["Hyde Park", 175, 255, 62, 34], ["Regent's Park", 305, 95, 48, 30], ["St James's Park", 395, 395, 30, 14],
  ["Victoria Park", 905, 160, 36, 22]];                         // approximate, for atmosphere only
function baseMap() {
  g.fillStyle = "#0b0d10"; g.fillRect(0, 0, W, H);
  paper(MX, MY, 1440, 1008, 9);
  g.save(); g.beginPath(); g.rect(MX, MY, 1440, 1008); g.clip();
  // faint survey grid
  g.strokeStyle = "rgba(120,90,50,0.08)"; g.lineWidth = 1;
  for (let x = MX; x < MX + 1440; x += 72) { g.beginPath(); g.moveTo(x, MY); g.lineTo(x, MY + 1008); g.stroke(); }
  for (let y = MY; y < MY + 1008; y += 72) { g.beginPath(); g.moveTo(MX, y); g.lineTo(MX + 1440, y); g.stroke(); }
  // districts: soft washes of colour behind their streets
  const tints = ["rgba(176,132,82,0.10)", "rgba(140,120,90,0.09)"];
  M.districts.forEach((d, i) => { const [x, y] = P([d.x, d.y]), r = 150;
    const gr = g.createRadialGradient(x, y, 10, x, y, r); gr.addColorStop(0, tints[i % 2]); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); });
  // parks
  for (const [n, x0, y0, rx, ry] of PARKS) { const [x, y] = P([x0, y0]);
    g.fillStyle = "rgba(112,140,88,0.28)"; g.beginPath(); g.ellipse(x, y, rx * MS, ry * MS, 0.15, 0, 7); g.fill();
    g.strokeStyle = "rgba(80,104,62,0.35)"; g.lineWidth = 1.5; g.stroke();
    text(n, x, y, {size: 15, color: "rgba(60,80,45,0.75)"}); }
  // the Thames: a band with darker banks, and its name along the water
  const river = () => { g.beginPath(); M.thames.forEach((p, i) => { const [x, y] = P(p); i ? g.lineTo(x, y) : g.moveTo(x, y); }); };
  g.lineCap = "round"; g.lineJoin = "round";
  river(); g.strokeStyle = "rgba(60,90,120,0.45)"; g.lineWidth = 34; g.stroke();
  river(); g.strokeStyle = "rgba(150,186,210,0.95)"; g.lineWidth = 28; g.stroke();
  river(); g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 6; g.stroke();
  { const [x1, y1] = P(M.thames[2]), [x2, y2] = P(M.thames[3]); g.save(); g.translate((x1 + x2) / 2, (y1 + y2) / 2 + 2); g.rotate(Math.atan2(y2 - y1, x2 - x1));
    text("RIVER  THAMES", 0, 0, {size: 16, color: "rgba(40,70,100,0.8)", spacing: 6}); g.restore(); }
  // streets: a pale casing under a fine ink line
  g.lineCap = "round";
  g.beginPath(); for (const [a, b] of M.edges) { const [ax, ay] = A(a), [bx, by] = A(b); g.moveTo(ax, ay); g.lineTo(bx, by); }
  g.strokeStyle = "rgba(250,242,222,0.9)"; g.lineWidth = 5; g.stroke();
  g.strokeStyle = "rgba(110,82,48,0.45)"; g.lineWidth = 1.4; g.stroke();
  // houses
  for (const a of M.addresses) { const [x, y] = P(a); g.fillStyle = "rgba(92,66,40,0.75)"; g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill(); }
  // district names, engraved
  for (const d of M.districts) { const [x, y] = P([d.x, d.y]); text(d.name.toUpperCase(), x, y - 56, {size: 20, color: "rgba(78,56,32,0.62)", font: SERIF, spacing: 4}); }
  g.restore();
  // frame: a double rule
  g.strokeStyle = "rgba(60,42,24,0.75)"; g.lineWidth = 3; g.strokeRect(MX + 10, MY + 10, 1420, 988);
  g.lineWidth = 1; g.strokeRect(MX + 18, MY + 18, 1404, 972);
  // cartouche and compass
  { const x = MX + 1100, y = MY + 690; g.fillStyle = "rgba(244,234,208,0.92)"; g.fillRect(x, y, 300, 72); g.strokeStyle = "rgba(60,42,24,0.7)"; g.lineWidth = 2; g.strokeRect(x, y, 300, 72);
    g.strokeRect(x + 5, y + 5, 290, 62); text("LONDON", x + 150, y + 28, {size: 30, color: INK, font: SERIF, spacing: 8});
    text("the murder map · 1890", x + 150, y + 54, {size: 16, color: "rgba(42,29,18,0.7)", font: SERIF, style: "italic"}); }
  { const x = MX + 1040, y = MY + 726; g.save(); g.translate(x, y); g.fillStyle = "rgba(60,42,24,0.75)";
    g.beginPath(); g.moveTo(0, -36); g.lineTo(8, 0); g.lineTo(0, 36); g.lineTo(-8, 0); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-26, 0); g.lineTo(0, 6); g.lineTo(26, 0); g.lineTo(0, -6); g.closePath(); g.fill();
    text("N", 0, -50, {size: 18, color: INK, font: SERIF, style: "bold"}); g.restore(); }
  // 221B and the scene of the crime
  const [bx, by] = A(M.baker); g.fillStyle = "rgba(244,234,208,0.95)"; g.beginPath(); g.arc(bx, by, 20, 0, 7); g.fill();
  star(bx, by, 16, INK); text("221B", bx, by - 34, {size: 24, color: INK, style: "bold"});
  text(`map: the real benchmark runs of case ${D.seed}: gpt-6-astra alone · gpt-6-astra with 12 Jev boys · 100 Jev boys`, MX + 1340, MY + 990 - 4, {size: 14, color: "rgba(42,29,18,0.55)", align: "right"});
  const [cx, cy] = A(M.scene); g.fillStyle = "rgba(163,23,29,0.15)"; g.beginPath(); g.arc(cx, cy, 24, 0, 7); g.fill();
  g.strokeStyle = RED; g.lineWidth = 6; g.lineCap = "round";
  g.beginPath(); g.moveTo(cx - 12, cy - 12); g.lineTo(cx + 12, cy + 12); g.moveTo(cx + 12, cy - 12); g.lineTo(cx - 12, cy + 12); g.stroke();
  text("the murder", cx, cy + 34, {size: 16, color: RED, style: "bold"});
}
function star(x, y, r, col) { g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill(); }
function walkers(run, f, col, r, trail = 0) {
  const T = run.length - 1, ft = f * T, i0 = Math.floor(ft), i1 = Math.min(T, i0 + 1), k = ft - i0;
  const at = (i, j) => run[clamp(i, 0, T)].boys[j];
  const n = run[i0].boys.length;
  for (let j = 0; j < n; j++) {
    const p = at(i0, j), q = at(i1, j) || p, pos = P([p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]);
    if (trail) { g.strokeStyle = col; g.globalAlpha = 0.35; g.lineWidth = 3; g.beginPath(); g.moveTo(...pos);
      for (let b = 0; b < trail; b++) g.lineTo(...P(at(i0 - b, j))); g.stroke(); g.globalAlpha = 1; }
    g.fillStyle = col; g.beginPath(); g.arc(pos[0], pos[1], r, 0, 7); g.fill();
  }
  return {a: run[i0], b: run[i1], k};
}
function caption(lines, t, a, b) {
  const al = fade(t, a, b, 0.35);
  if (al <= 0) return;
  g.save(); g.globalAlpha = al * 0.82; const gr = g.createLinearGradient(0, H - 230, 0, H);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(0.35, "rgba(0,0,0,0.85)"); gr.addColorStop(1, "rgba(0,0,0,0.92)");
  g.fillStyle = gr; g.fillRect(0, H - 230, W, 230); g.restore();
  lines.forEach((l, i) => text(l, W / 2, H - 120 + i * 58 - (lines.length - 1) * 29, {size: 48, alpha: al}));
}
function chapter(num, title, sub, t, a) {
  const al = fade(t, a, a + 2.6, 0.4);
  if (al <= 0) return;
  g.save(); g.globalAlpha = al * 0.85; g.fillStyle = "rgba(6,8,11,0.9)"; g.fillRect(70, 70, 780, 200); g.restore();
  text(num, 110, 128, {size: 34, color: GOLD, align: "left", alpha: al, spacing: 6});
  text(title, 110, 186, {size: 58, align: "left", alpha: al});
  text(sub, 110, 240, {size: 28, color: DIM, align: "left", style: "italic", alpha: al});
}
function hud(h) { h += 24; g.save(); g.fillStyle = "rgba(6,8,11,0.82)"; g.fillRect(W - 440, 40, 410, h); g.strokeStyle = "rgba(224,179,87,0.5)"; g.lineWidth = 2; g.strokeRect(W - 440, 40, 410, h); g.restore(); }
const secs = (w) => w < 60 ? `${Math.round(w)} s` : `${Math.floor(w / 60)} min ${String(Math.round(w % 60)).padStart(2, "0")} s`;
function clock(minutes, alpha = 1, wall = null) {
  // time since the case began, against the 12-hour limit every approach gets
  const m = Math.min(720, minutes), hh = Math.floor(m / 60), mm = Math.floor(m % 60);
  text(`${hh}h ${String(mm).padStart(2, "0")}m`, W - 60, 104, {size: 52, align: "right", alpha, style: "bold"});
  text("of the 12 hours allowed", W - 60, 150, {size: 22, color: DIM, align: "right", alpha, style: "italic"});
  g.fillStyle = "rgba(239,230,207,0.2)"; g.fillRect(W - 360, 170, 300, 8);
  g.fillStyle = GOLD; g.fillRect(W - 360, 170, 300 * m / 720, 8);
  if (wall !== null) text(`real time: ${wall < 60 ? Math.round(wall) + " s" : Math.floor(wall / 60) + " min " + String(Math.round(wall % 60)).padStart(2, "0") + " s"}`,
    W - 60, 196, {size: 22, color: CREAM, align: "right", alpha, style: "italic"});
}
const hrs = (m) => `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, "0")}m`;
function verdictTag(s, t, a, col) {
  if (t < a) return;
  g.save(); g.font = `bold 32px ${SERIF}`; g.letterSpacing = "2px"; const w = g.measureText(s).width + 60; g.restore();
  const p = prog(t, a, a + 0.3); g.save(); g.globalAlpha = p; g.translate(W - 70 - w / 2, 580); g.rotate(-0.05);
  g.fillStyle = "rgba(6,8,11,0.85)"; g.fillRect(-w / 2, -40, w, 80); g.strokeStyle = col; g.lineWidth = 5; g.strokeRect(-w / 2, -40, w, 80);
  text(s, 0, 2, {size: 32, color: col, style: "bold", spacing: 2}); g.restore();
}
function note(s, alpha = 1) { text(s, W - 60, 228, {size: 26, color: CREAM, align: "right", style: "italic", alpha}); }

/* ================================================================ scenes */
// stretch(): play a scene written for its own time window [i0, i1] inside the slot [s0, s1] of this cut
const stretch = (fn, s0, s1, i0, i1) => (t) => fn(i0 + (t - s0) * (i1 - i0) / (s1 - s0));
const local = (fn, s0) => (t) => fn(t - s0);
const SCENES = [[0, 5, stretch(night, 0, 5, 0, 4.6)], [5, 10.5, stretch(irregularsQuote, 5, 10.5, 4.6, 9.0)],
  [10.5, 16, stretch(minskyQuote, 10.5, 16, 9.0, 13.0)], [16, 25, local(experiment, 16)],
  [25, 43, local(chapLone, 25)], [43, 61, local(chapBaker, 43)], [61, 77, local(chapSwarm, 61)],
  [77, 82.5, local(casebook2, 77)], [82.5, 92.5, local(frameup, 82.5)], [92.5, 95.01, stretch(endCard, 92.5, 95, 43.2, 45.0)]];

function skyline(y, col, seed) {   // London rooftops: chimneys, a dome and a clock tower
  const r = rng(seed); g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
  let x = 0;
  while (x < W) { const w = 60 + r() * 120, h = 40 + r() * 110; g.lineTo(x, y - h); g.lineTo(x + w * 0.2, y - h);
    if (r() < 0.6) { g.lineTo(x + w * 0.2, y - h - 26); g.lineTo(x + w * 0.3, y - h - 26); g.lineTo(x + w * 0.3, y - h); }
    g.lineTo(x + w, y - h); x += w; }
  g.lineTo(W, H); g.closePath(); g.fill();
  g.beginPath(); g.arc(1320, y - 150, 70, Math.PI, 0); g.fill(); g.fillRect(1250, y - 150, 140, 150); g.fillRect(1312, y - 250, 16, 40);  // dome
  g.fillRect(420, y - 300, 50, 300); g.beginPath(); g.moveTo(410, y - 300); g.lineTo(445, y - 360); g.lineTo(480, y - 300); g.fill(); // clock tower
}
function rain(t, alpha) {
  const r = rng(77); g.strokeStyle = `rgba(200,210,220,${0.12 * alpha})`; g.lineWidth = 1.5; g.beginPath();
  for (let i = 0; i < 160; i++) { const x = (r() * W + t * 60) % W, y = (r() * H + t * (700 + r() * 300)) % H; g.moveTo(x, y); g.lineTo(x - 6, y + 22); }
  g.stroke();
}
function lamp(x, y, t, alpha) {
  const fl = 0.85 + 0.15 * Math.sin(t * 17) * Math.sin(t * 5.3);
  const gl = g.createRadialGradient(x, y, 0, x, y, 380); gl.addColorStop(0, `rgba(255,196,110,${0.45 * fl * alpha})`); gl.addColorStop(1, "rgba(255,196,110,0)");
  g.fillStyle = gl; g.fillRect(x - 380, y - 380, 760, 760);
  g.save(); g.globalAlpha = alpha; g.fillStyle = "#0c0a08"; g.fillRect(x - 7, y + 20, 14, H - y); g.fillRect(x - 20, H - 60, 40, 60);
  g.fillStyle = `rgba(255,214,140,${fl})`; g.beginPath(); g.moveTo(x - 22, y - 20); g.lineTo(x + 22, y - 20); g.lineTo(x + 14, y + 22); g.lineTo(x - 14, y + 22); g.fill();
  g.fillStyle = "#0c0a08"; g.beginPath(); g.moveTo(x - 30, y - 20); g.lineTo(x, y - 46); g.lineTo(x + 30, y - 20); g.fill(); g.restore();
}
function night(t) {
  const al = fade(t, 0.0, 4.6, 0.6), z = 1 + 0.05 * prog(t, 0, 4.6);
  g.fillStyle = "#05070a"; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
  skyline(560, "#0b0e13", 5);
  fog(t, 0.5, false); g.globalAlpha = 1;
  window221(t, al);
  lamp(330, 470, t, al);
  // wet cobbles catching the lamplight
  g.save(); g.globalAlpha = al; const r = rng(31);
  for (let i = 0; i < 260; i++) { const x = r() * W, y = 1010 + r() * 80; g.fillStyle = `rgba(${150 + r() * 60},${120 + r() * 40},80,${0.05 + r() * 0.08})`;
    g.beginPath(); g.ellipse(x, y, 16 + r() * 10, 5, 0, 0, 7); g.fill(); }
  g.restore();
  g.restore();
  rain(t, al);
  text("221B Baker Street, London. 1890.", W / 2, 1040, {size: 34, color: CREAM, style: "italic", alpha: fade(t, 0.5, 4.4, 0.4)});
  vignette(0.8);
}
function irregularsQuote(t) {
  g.fillStyle = "#05070a"; g.fillRect(0, 0, W, H);
  const al = fade(t, 4.6, 9.0, 0.4);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#0a0d12"); sky.addColorStop(1, "#1a140d"); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  skyline(900, "#07090c", 9);
  fog(t, 0.6, false);
  // a dozen street boys dart along the street, each his own way
  const r = rng(12);
