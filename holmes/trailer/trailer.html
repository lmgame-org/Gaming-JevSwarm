<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Irregulars trailer</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* The Irregulars: a 45-second trailer. render(t) draws the frame at t seconds; nothing depends on wall time, so
   frames can be rendered one by one (render.py) or played live (open with #play). Data: trailer_data.json, inlined
   by render.py as window.DATA. Fonts are macOS system fonts, so nothing is fetched. */
const D = window.DATA;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1920, H = 1080, DUR = 45;
const HAND = "'Chalkboard SE', 'Comic Sans MS', cursive";
const SERIF = "Baskerville, 'Libre Baskerville', Georgia, serif";
const GREY = "#d9d9d9", INK = "#1b1b1b", RED = "#c8102e", TEAL = "#a8f0dc", LILAC = "#c9a2f2";

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const pop = (x) => x < 0.6 ? ease(x / 0.6) * 1.12 : 1.12 - 0.12 * ease((x - 0.6) / 0.4);
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function text(s, x, y, {size = 64, font = HAND, color = INK, align = "center", weight = "bold", alpha = 1, base = "middle"} = {}) {
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  g.font = `${weight} ${size}px ${font}`; g.fillText(s, x, y); g.restore();
}
function wrap(s, maxW, size, font = HAND, weight = "bold") {
  g.font = `${weight} ${size}px ${font}`;
  const words = s.split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function para(s, x, y, maxW, opt = {}) {
  const size = opt.size || 56, lh = opt.lh || size * 1.3;
  const lines = wrap(s, maxW, size, opt.font || HAND, opt.weight || "bold");
  const y0 = opt.top ? y : y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => text(l, x, y0 + i * lh, opt));
  return lines.length * lh;
}
const typed = (s, t, a, cps = 38) => s.slice(0, Math.max(0, Math.floor((t - a) * cps)));

/* ---------------------------------------------------------------- backgrounds */
function greyCard() { g.fillStyle = GREY; g.fillRect(0, 0, W, H); }
function fog(t, alpha = 1) {
  g.fillStyle = "#07090c"; g.fillRect(0, 0, W, H);
  const r = rng(7);
  for (let i = 0; i < 14; i++) {
    const x = (r() * W + t * (20 + r() * 40)) % (W + 600) - 300, y = r() * H, rad = 260 + r() * 340;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(160,170,180,${0.08 * alpha})`); gr.addColorStop(1, "rgba(160,170,180,0)");
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // a gas lamp glow
  const gl = g.createRadialGradient(1640, 260, 0, 1640, 260, 420);
  gl.addColorStop(0, `rgba(255,190,90,${0.22 * alpha})`); gl.addColorStop(1, "rgba(255,190,90,0)");
  g.fillStyle = gl; g.fillRect(1200, 0, 720, 720);
}

/* ---------------------------------------------------------------- splash ("HOLD IT!" style, our own lettering) */
function burst(cx, cy, R, seed, spikes = 22) {
  const r = rng(seed); g.beginPath();
  for (let i = 0; i <= spikes * 2; i++) {
    const a = (i / (spikes * 2)) * Math.PI * 2, rr = i % 2 ? R * (0.55 + r() * 0.15) : R * (0.95 + r() * 0.35);
    const x = cx + Math.cos(a) * rr * 1.45, y = cy + Math.sin(a) * rr;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function splash(t, a, b, word, {size = 210, bg = GREY, seed = 3, tilt = -0.08} = {}) {
  const x = prog(t, a, a + 0.28), out = prog(t, b - 0.12, b);
  const s = pop(x) * (1 - out * 0.15), shake = t - a < 0.35 ? Math.sin((t - a) * 90) * 14 * (1 - x) : 0;
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = 1 - out; g.translate(W / 2 + shake, H / 2); g.scale(s, s); g.rotate(tilt);
  burst(0, 0, 330, seed); g.fillStyle = "#fff"; g.fill(); g.lineWidth = 10; g.strokeStyle = "#111"; g.stroke();
  g.font = `bold ${size}px ${HAND}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = 34; g.strokeStyle = "#fff"; g.strokeText(word, 0, 10);
  g.lineWidth = 14; g.strokeStyle = "#5a0010"; g.strokeText(word, 0, 10);
  g.fillStyle = RED; g.fillText(word, 0, 10);
  g.restore();
}
function stamp(t, a, word, x, y, {color = RED, size = 120, rot = -0.18} = {}) {
  if (t < a) return;
  const p = prog(t, a, a + 0.22), s = 1.8 - 0.8 * ease(p);
  g.save(); g.globalAlpha = clamp(p * 1.5); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.font = `bold ${size}px ${HAND}`; const w = g.measureText(word).width + 70;
  g.lineWidth = 12; g.strokeStyle = color; g.strokeRect(-w / 2, -size * 0.72, w, size * 1.44);
  g.fillStyle = color; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(word, 0, 6);
  g.restore();
}

/* ---------------------------------------------------------------- speech bubble ("Thinking process") */
function bubble(x, y, w, label, who, body, t, a, cps = 55) {
  const p = prog(t, a, a + 0.25);
  g.save(); g.globalAlpha = p; g.translate(0, (1 - ease(p)) * 30);
  const lines = wrap(body, w - 70, 40, HAND, "bold");
  const h = Math.max(150, 70 + lines.length * 52);
  g.fillStyle = LILAC; round(x + 12, y + 12, w, h, 60); g.fill();
  g.fillStyle = TEAL; round(x, y, w, h, 60); g.fill();
  g.beginPath(); g.moveTo(x + 90, y + h - 4); g.lineTo(x + 40, y + h + 60); g.lineTo(x + 170, y + h - 4); g.closePath(); g.fill();
  text(label, x + 40, y - 26, {size: 34, align: "left"});
  const shown = typed(body, t, a + 0.2, cps);
  let n = 0;
  lines.forEach((l, i) => { const k = Math.max(0, Math.min(l.length, shown.length - n)); n += l.length + 1;
    text(l.slice(0, k), x + 36, y + 58 + i * 52, {size: 40, align: "left"}); });
  robot(x - 120, y + h + 40, who);
  g.restore();
  return h;
}
function round(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function robot(x, y, who) {
  g.save(); g.fillStyle = INK;
  round(x + 20, y - 36, 80, 64, 24); g.fill();
  g.fillStyle = GREY; g.beginPath(); g.arc(x + 46, y - 6, 9, 0, 7); g.arc(x + 74, y - 6, 9, 0, 7); g.fill();
  g.fillStyle = INK; g.fillRect(x + 56, y - 60, 8, 24); g.beginPath(); g.arc(x + 60, y - 62, 9, 0, 7); g.fill();
  text(who, x + 60, y + 62, {size: 30});
  g.restore();
}

/* ---------------------------------------------------------------- portraits (simple silhouettes) */
function holmes(x, y, s, col = INK) {   // deerstalker and pipe
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.ellipse(0, -40, 62, 74, 0, 0, 7); g.fill();                         // head
  g.beginPath(); g.moveTo(-80, -70); g.quadraticCurveTo(0, -190, 80, -70); g.lineTo(96, -60); g.lineTo(-96, -60); g.fill(); // cap
  g.beginPath(); g.moveTo(-150, 200); g.quadraticCurveTo(-140, 40, 0, 30); g.quadraticCurveTo(140, 40, 150, 200); g.fill(); // cape
  g.lineWidth = 12; g.strokeStyle = col; g.beginPath(); g.moveTo(40, 0); g.quadraticCurveTo(80, 20, 96, 6); g.stroke();
  g.fillRect(88, -18, 22, 28);
  g.restore();
}
function detective(x, y, s, col = INK) { // top hat and magnifying glass
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.ellipse(0, -40, 60, 72, 0, 0, 7); g.fill();
  g.fillRect(-56, -190, 112, 110); g.fillRect(-92, -92, 184, 18);
  g.beginPath(); g.moveTo(-140, 200); g.quadraticCurveTo(-130, 40, 0, 30); g.quadraticCurveTo(130, 40, 140, 200); g.fill();
  g.lineWidth = 14; g.strokeStyle = col; g.beginPath(); g.arc(150, -10, 46, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(118, 24); g.lineTo(70, 90); g.stroke();
  g.restore();
}
function boy(x, y, s, col = INK) {       // flat cap
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.ellipse(0, -30, 40, 46, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(6, -66, 54, 20, -0.15, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-80, 110); g.quadraticCurveTo(-70, 20, 0, 14); g.quadraticCurveTo(70, 20, 80, 110); g.fill();
  g.restore();
}
function plate(x, y, label, sub, p) {
  g.save(); g.globalAlpha = p;
  text(label, x, y, {size: 46}); para(sub, x, y + 60, 460, {size: 28, weight: "normal", color: "#333", top: true, lh: 36});
  g.restore();
}

/* ---------------------------------------------------------------- evidence icons */
function icon(kind, x, y, s = 1) {
  g.save(); g.translate(x, y); g.scale(s, s); g.lineWidth = 6; g.strokeStyle = INK;
  if (kind === "boot") { g.fillStyle = "#6b4a2b"; g.beginPath(); g.ellipse(0, 10, 26, 46, 0.2, 0, 7); g.fill(); g.beginPath(); g.ellipse(14, -50, 18, 20, 0.2, 0, 7); g.fill(); }
  if (kind === "cigar") { g.fillStyle = "#8a5a2b"; g.save(); g.rotate(-0.5); round(-60, -12, 120, 24, 12); g.fill(); g.fillStyle = "#e33"; g.fillRect(52, -12, 10, 24); g.fillStyle = "#c9a227"; g.fillRect(-24, -13, 16, 26); g.restore(); }
  if (kind === "will") { g.fillStyle = "#f3e7c3"; g.fillRect(-38, -50, 76, 100); g.strokeRect(-38, -50, 76, 100); for (let i = 0; i < 5; i++) g.fillStyle = INK, g.fillRect(-26, -32 + i * 16, 52 - (i % 2) * 14, 4); g.fillStyle = RED; g.beginPath(); g.arc(20, 34, 12, 0, 7); g.fill(); }
  if (kind === "book") { g.fillStyle = "#2f4f7f"; g.fillRect(-44, -50, 88, 100); g.fillStyle = "#c9a227"; g.fillRect(-30, -20, 60, 8); g.fillRect(-30, 0, 60, 8); }
  if (kind === "brick") { g.fillStyle = "#b5462e"; g.beginPath(); g.moveTo(-50, 10); g.lineTo(-20, -30); g.lineTo(40, -24); g.lineTo(56, 20); g.lineTo(10, 40); g.closePath(); g.fill(); }
  if (kind === "coin") { g.fillStyle = "#e1b530"; g.beginPath(); g.arc(0, 0, 52, 0, 7); g.fill(); g.stroke(); text("£", 0, 4, {size: 60, font: SERIF, color: "#7a5a0a"}); }
  g.restore();
}

/* ---------------------------------------------------------------- the map footage (real runs, case 3) */
function mapPanel(x, y, w, h, run, frac, opts) {
  const m = D.map, sx = w / 1000, sy = h / 700, P = ([ax, ay]) => [x + ax * sx, y + ay * sy];
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = "#f4efe3"; g.fillRect(x, y, w, h);
  g.strokeStyle = "#8fb3cf"; g.lineWidth = 14 * sx; g.beginPath();
  m.thames.forEach((p, i) => { const [px, py] = P(p); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke();
  g.strokeStyle = "#cfc5ad"; g.lineWidth = 1.5;
  const idx = Object.fromEntries(m.ids.map((id, i) => [id, i]));
  g.beginPath();
  for (const [a, b] of m.edges) { const [ax, ay] = P(m.addresses[idx[a]]), [bx, by] = P(m.addresses[idx[b]]); g.moveTo(ax, ay); g.lineTo(bx, by); }
  g.stroke();
  g.fillStyle = "#9a8f78";
  for (const a of m.addresses) { const [px, py] = P(a); g.fillRect(px - 2.5, py - 2.5, 5, 5); }
  for (const d of m.districts) { const [px, py] = P([d.x, d.y]); text(d.name.toUpperCase(), px, py - 40 * sy, {size: 15, font: SERIF, color: "#a39a85", weight: "normal"}); }
  const [bx, by] = P(m.addresses[idx[m.baker]]);
  star(bx, by, 16, INK); text("221B", bx, by - 26, {size: 20, font: SERIF});
  const [cx, cy] = P(m.addresses[idx[m.scene]]);
  g.strokeStyle = RED; g.lineWidth = 5; g.beginPath(); g.moveTo(cx - 10, cy - 10); g.lineTo(cx + 10, cy + 10); g.moveTo(cx + 10, cy - 10); g.lineTo(cx - 10, cy + 10); g.stroke();
  // walkers, interpolated between ticks
  const T = run.length - 1, ft = frac * T, i0 = Math.floor(ft), i1 = Math.min(T, i0 + 1), k = ft - i0;
  const A = run[i0], B = run[i1];
  if (opts.swarm && A.shares) {
    g.strokeStyle = "rgba(200,16,46,0.18)"; g.lineWidth = 2;
    for (const s of A.shares.slice(0, 25)) { const [px, py] = P(s); g.beginPath(); g.arc(px, py, (200 * sx) * (0.3 + 0.7 * k), 0, 7); g.stroke(); }
  }
  g.fillStyle = opts.color;
  A.boys.forEach((p, j) => { const q = B.boys[j] || p; const [px, py] = P([p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]);
    g.beginPath(); g.arc(px, py, opts.r, 0, 7); g.fill(); });
  if (A.w) { const q = B.w || A.w; const [px, py] = P([A.w[0] + (q[0] - A.w[0]) * k, A.w[1] + (q[1] - A.w[1]) * k]);
    g.fillStyle = "#c9a227"; g.beginPath(); g.arc(px, py, opts.r + 5, 0, 7); g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke(); }
  g.restore();
  g.lineWidth = 4; g.strokeStyle = INK; g.strokeRect(x, y, w, h);
  return A;
}
function star(x, y, r, col) { g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill(); }

/* ---------------------------------------------------------------- scoreboard bars */
function bars(x, y, rows, p, {w = 640, title = "", rowH = 74} = {}) {
  if (title) text(title, x, y - 54, {size: 46, align: "left"});
  rows.forEach(([label, n, col], i) => {
    const q = ease(prog(p, i * 0.12, i * 0.12 + 0.6)), yy = y + i * rowH;
    text(label, x, yy, {size: 32, align: "left", weight: "bold"});
    g.fillStyle = "#bdbdbd"; g.fillRect(x, yy + 20, w, 22);
    g.fillStyle = col; g.fillRect(x, yy + 20, w * (n / 20) * q, 22);
    text(`${Math.round(n * q)}/20`, x + w + 20, yy + 31, {size: 34, align: "left"});
  });
}

/* ================================================================ the timeline */
const H1 = D.holmesian;
const SCENES = [
  [0, 4.0, coldOpen], [4.0, 5.2, (t) => splash(t, 4.0, 5.2, "The game is afoot!", {size: 150, bg: "#07090c", seed: 5})],
  [5.2, 10.5, premise], [10.5, 15.5, cast], [15.5, 21.0, firstTurnabout],
  [21.0, 22.0, (t) => splash(t, 21.0, 22.0, "Hold it!", {seed: 11})], [22.0, 24.0, tooEasy],
  [24.0, 25.6, secondTitle], [25.6, 29.2, testimony], [29.2, 31.1, counting], [31.1, 34.2, holmesThinks],
  [34.2, 35.7, present], [35.7, 37.0, (t) => splash(t, 35.7, 37.0, "Objection!", {seed: 23, tilt: 0.06})],
  [37.0, 40.2, verdict], [40.2, 43.0, morals], [43.0, 45.01, endCard],
];

function coldOpen(t) {
  fog(t);
  const q = "“It is a capital mistake to theorise before one has data.”";
  text(typed(q, t, 0.3, 30), W / 2, 440, {size: 54, font: SERIF, color: "#e9e2cf", weight: "normal"});
  text("Sherlock Holmes, A Scandal in Bohemia", W / 2, 520, {size: 30, font: SERIF, color: "#9c937e", weight: "normal", alpha: prog(t, 2.4, 2.8)});
  text("Can AI solve a murder? And should it work alone?", W / 2, 700, {size: 58, color: "#fff", alpha: prog(t, 2.8, 3.1)});
}
function premise(t) {
  greyCard();
  if (t < 7.0) {
    text("We built a murder in Victorian London.", W / 2, 440, {size: 76, alpha: prog(t, 5.2, 5.45)});
    text("100 addresses · 10 suspects · one culprit, one motive, one hideout · 12 hours", W / 2, 560, {size: 40, weight: "normal", alpha: prog(t, 5.7, 6.0)});
  } else if (t < 8.8) {
    text("Every address holds one lead…", W / 2, 470, {size: 80, alpha: prog(t, 7.0, 7.25)});
    text("…or a lie.", W / 2, 590, {size: 80, color: RED, alpha: prog(t, 7.8, 8.0)});
  } else {
    const s = 1 + 0.06 * ease(prog(t, 8.8, 10.5));
    g.save(); g.translate(W / 2, H / 2); g.scale(s, s); text("Who solves it best?", 0, 0, {size: 110}); g.restore();
  }
}
function cast(t) {
  greyCard();
  text("Game logic: name the culprit, the motive and the hideout before time runs out.", W / 2, 90, {size: 44, alpha: prog(t, 10.5, 10.8)});
  const cols = [380, 960, 1540], ap = (i) => ease(prog(t, 10.7 + i * 0.45, 11.1 + i * 0.45));
  g.save(); g.globalAlpha = ap(0); detective(cols[0], 470, 1.0); g.restore();
  plate(cols[0], 720, "The Lone Detective", "gpt-6-astra, one cab, one address at a time", ap(0));
  g.save(); g.globalAlpha = ap(1); holmes(cols[1] - 40, 450, 0.95); for (let i = 0; i < 3; i++) boy(cols[1] + 90 + i * 55, 560 - (i % 2) * 18, 0.42); g.restore();
  plate(cols[1], 720, "Holmes & the Irregulars", "Holmes at 221B, Wiggins and 12 boys", ap(1));
  g.save(); g.globalAlpha = ap(2); const r = rng(4);
  for (let i = 0; i < 26; i++) boy(cols[2] - 210 + r() * 420, 360 + r() * 260, 0.22 + r() * 0.12); g.restore();
  plate(cols[2], 720, "The Swarm", "100 street boys, no one in charge", ap(2));
  ["boot", "cigar", "will", "book", "brick"].forEach((k, i) => { const p = ease(prog(t, 12.4 + i * 0.12, 12.8 + i * 0.12));
    g.save(); g.globalAlpha = p; icon(k, W / 2 - 400 + i * 200, 920 + (1 - p) * 40, 0.9); g.restore(); });
}
function firstTurnabout(t) {
  greyCard();
  if (t < 16.8) {
    text("The First Turnabout:", W / 2, 440, {size: 90, alpha: prog(t, 15.5, 15.7)});
    text("the Standard Case", W / 2, 570, {size: 90, alpha: prog(t, 15.8, 16.0)});
    return;
  }
  const f = ease(prog(t, 16.8, 20.2));
  text("Holmes & the Irregulars", 495, 120, {size: 44});
  const A = mapPanel(80, 160, 830, 581, D.baker, f, {color: "#2a5d9f", r: 7});
  text(`reports reaching 221B: ${A.reports}`, 495, 780, {size: 32, weight: "normal"});
  text("The Swarm", 1425, 120, {size: 44});
  const S = mapPanel(1010, 160, 830, 581, D.swarm, f, {color: "#b0413e", r: 4.5, swarm: true});
  text(`boys voting the true answer: ${S.truth_votes} (30 close the case)`, 1425, 780, {size: 32, weight: "normal"});
  text("real runs, case 3 (free counting heuristics)", W / 2, 830, {size: 24, weight: "normal", color: "#555"});
  if (t > 19.4) {
    const p = prog(t, 19.4, 20.6);
    g.save(); g.globalAlpha = clamp(p * 3) * 0.94; g.fillStyle = GREY; g.fillRect(0, 0, W, H); g.restore();
    bars(560, 330, [["Holmes & the Irregulars", 19, "#2a5d9f"], ["The Swarm (counting rule)", 18, "#b0413e"], ["The Lone Detective (gpt-6-astra)", 11, "#555"]],
      p, {w: 700, title: "Standard cases, solved out of 20", rowH: 120});
  }
}
function tooEasy(t) {
  greyCard();
  text("Wait. A simple counting rule did as well?", W / 2, 360, {size: 66, alpha: prog(t, 22.0, 22.2)});
  text("The case was too easy:", W / 2, 520, {size: 66, alpha: prog(t, 22.6, 22.8)});
  text("the truth always came twice, and a lie came alone.", W / 2, 620, {size: 66, color: RED, alpha: prog(t, 22.9, 23.1)});
}
function secondTitle(t) {
  greyCard();
  text("The Second Turnabout:", W / 2, 400, {size: 90, alpha: prog(t, 24.0, 24.2)});
  text("the Holmesian Case", W / 2, 520, {size: 90, alpha: prog(t, 24.2, 24.4)});
  text("The murderer paid his own servants to lie.", W / 2, 690, {size: 54, color: RED, alpha: prog(t, 24.7, 24.9)});
}
function testimony(t) {
  fog(t, 0.6);
  text("— Testimony —", W / 2, 120, {size: 64, color: "#ff9f1a"});
  const lines = [
    ["The coachman, in Pargeter's service", "“The culprit takes snuff, sir. I swept up the ash myself.”"],
    ["Pargeter's valet", "“Hairs from someone grey-haired. I'd swear to it.”"],
    ["Pargeter's housekeeper", "“My master was at home all evening and never went out.”"],
  ];
  lines.forEach(([who, say], i) => {
    const a = 25.7 + i * 1.15; if (t < a) return;
    const y = 250 + i * 250, p = ease(prog(t, a, a + 0.2));
    g.save(); g.globalAlpha = p; g.translate((1 - p) * -60, 0);
    g.fillStyle = "rgba(10,18,40,0.92)"; g.fillRect(160, y, 1600, 190); g.strokeStyle = "#7f97c7"; g.lineWidth = 4; g.strokeRect(160, y, 1600, 190);
    g.fillStyle = "#3a5fa8"; g.fillRect(190, y - 26, 640, 52); text(who, 210, y, {size: 32, align: "left", color: "#fff"});
    text(typed(say, t, a + 0.1, 60), 210, y + 108, {size: 46, align: "left", color: "#58e05a"});
    g.restore();
  });
}
function counting(t) {
  greyCard();
  bubble(260, 230, 1400, "Thinking process:", "counting rule",
    `Two servants say snuff, one witness says otherwise. The majority wins: it must be ${H1.framed}.`, t, 29.2);
  stamp(t, 30.25, "WRONG MAN", W / 2 + 330, 640);
  text("Every approach that counts: 0 of 20 Holmesian cases", W / 2, 900, {size: 50, color: RED, alpha: prog(t, 30.5, 30.7)});
}
function holmesThinks(t) {
  greyCard();
  bubble(260, 200, 1400, "Thinking process:", "gpt-6-astra as Holmes", H1.holmes, t, 31.1, 75);
  text("(its actual words in Holmesian case 1)", W / 2, 960, {size: 30, weight: "normal", color: "#444", alpha: prog(t, 31.6, 31.9)});
}
function present(t) {
  fog(t, 0.5);
  const x = 260, y = 220, w = 1400, h = 520, p = ease(prog(t, 34.2, 34.45));
  g.save(); g.globalAlpha = p;
  g.fillStyle = "#1e3e6e"; g.fillRect(x, y, w, h); g.strokeStyle = "#9fc3ff"; g.lineWidth = 6; g.strokeRect(x, y, w, h);
  g.fillStyle = "#fff"; g.fillRect(x + 40, y + 60, 280, 280); icon("coin", x + 180, y + 200, 1.6);
  g.fillStyle = "#f2b705"; g.fillRect(x + 360, y + 60, 980, 70); text("Evidence: the bribe", x + 380, y + 96, {size: 46, align: "left"});
  para("The publican saw Pargeter hand a sovereign each to his own servants the morning after: “and mind you all tell it the same way.”",
    x + 380, y + 170, 940, {size: 40, align: "left", color: "#fff", weight: "normal", top: true});
  const blink = t > 34.9 && Math.floor(t * 8) % 2 === 0;
  g.fillStyle = blink ? "#f2b705" : "#2f5da8"; round(x + w - 330, y + h - 110, 290, 80, 20); g.fill();
  text("PRESENT", x + w - 185, y + h - 70, {size: 44, color: blink ? INK : "#fff"});
  g.restore();
}
function verdict(t) {
  greyCard();
  const p = prog(t, 37.1, 39.4);
  bars(110, 300, [["Holmes & the Irregulars", 19, "#2a5d9f"], ["The Swarm (counting rule)", 18, "#b0413e"], ["The Lone Detective", 11, "#555"]],
    p, {w: 560, title: "Standard cases", rowH: 120});
  bars(1020, 300, [["Holmes (gpt-6-astra) & the Irregulars", 17, "#2a5d9f"], ["The Lone Detective (gpt-6-astra)", 11, "#555"],
    ["The Swarm (Jev, reads the text)", 9, "#b0413e"], ["Everything that only counts", 0, "#999"]],
    prog(t, 37.6, 39.8), {w: 640, title: "Holmesian cases", rowH: 120});
  text("solved out of 20 · 12 case hours each", W / 2, 900, {size: 30, weight: "normal", color: "#444"});
}
function morals(t) {
  greyCard();
  text("Counting finds the crowd.", W / 2, 300, {size: 76, alpha: prog(t, 40.2, 40.4)});
  text("Reasoning finds the liar.", W / 2, 410, {size: 76, color: RED, alpha: prog(t, 40.6, 40.8)});
  text("A genius alone runs out of time.", W / 2, 600, {size: 60, alpha: prog(t, 41.2, 41.4)});
  text("A genius with Irregulars solves the case.", W / 2, 690, {size: 60, alpha: prog(t, 41.6, 41.8)});
  stamp(t, 42.2, "SOLVED", 1540, 880, {size: 110, rot: -0.12});
}
function endCard(t) {
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const p = prog(t, 43.1, 43.6);
  text("THE IRREGULARS", W / 2, 470, {size: 120, font: SERIF, color: "#efe6cf", weight: "normal", alpha: p});
  text("a swarm experiment · solo, Baker Street and swarm detectives", W / 2, 580, {size: 40, font: SERIF, color: "#9c937e", weight: "normal", alpha: prog(t, 43.5, 43.9)});
  text("“Elementary.”", W / 2, 720, {size: 56, font: SERIF, color: "#efe6cf", weight: "normal", alpha: prog(t, 44.0, 44.3)});
}

function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  const sc = SCENES.find(([a, b]) => t >= a && t < b) || SCENES[SCENES.length - 1];
  sc[2](t);
  // a quick white flash on every cut into a splash
  for (const a of [4.0, 21.0, 35.7]) if (t >= a && t < a + 0.08) { g.fillStyle = "rgba(255,255,255,0.85)"; g.fillRect(0, 0, W, H); }
}
window.render = render;
const q = new URLSearchParams(location.search);
if (location.hash === "#play") { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
else render(parseFloat(q.get("t") || "0"));
</script>
